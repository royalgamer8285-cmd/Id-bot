<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users</title><style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:20px}table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #334155;text-align:left;font-size:13px}th{background:#334155}a{color:#38bdf8}</style></head><body><h2>👥 All Users</h2><a href="/">← Dashboard</a><br><br><table><tr><th>ID</th><th>Username</th><th>Name</th><th>Credits</th><th>Spent</th><th>Joined</th></tr>{% for u in users %}<tr><td><code>{{u['user_id']}}</code></td><td>@{{u['username']}}</td><td>{{u['first_name']}}</td><td>{{u['credits']}}</td><td>{{u['total_spent']}}</td><td>{{u['joined_at'][:16]}}</td></tr>{% endfor %}</table></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Transactions</title><style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:20px}table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #334155;font-size:13px}th{background:#334155}a{color:#38bdf8}.pending{color:#fbbf24}.approved{color:#22c55e}.btn{padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:12px}.approve{background:#22c55e;color:#fff}</style></head><body><h2>💳 Transactions</h2><a href="/">← Dashboard</a><br><br><table><tr><th>ID</th><th>User</th><th>Amount</th><th>INR</th><th>Method</th><th>Status</th><th>Proof</th><th>Action</th></tr>{% for t in txs %}<tr><td>{{t['id']}}</td><td>{{t['user_id']}}</td><td>{{t['amount']}} 💎</td><td>₹{{t['price_inr']}}</td><td>{{t['method']}}</td><td class="{{t['status']}}">{{t['status']}}</td><td style="max-width:150px;overflow:hidden">{{t['proof'][:30]}}</td><td>{% if t['status']=='pending' %}<a class="btn approve" href="/approve/{{t['id']}}">✅ Approve</a>{% else %}—{% endif %}</td></tr>{% endfor %}</table></body></html>

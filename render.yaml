services:
  # 🤖 Telegram Bot - Web Service (Keep-Alive + Persistent Disk)
  - type: web
    name: funstat-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: funstat-data
      mountPath: /data
      sizeGB: 1

  # 🌐 Dedicated Website - Static Site
  - type: web
    name: funstat-website
    env: static
    region: singapore
    plan: free
    staticPublishPath: ./dedicated-site
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 👑 Owner Panel - Web Service (also persistent)
  - type: web
    name: funstat-owner-panel
    env: python
    region: singapore
    plan: free
    buildCommand: pip install Flask aiosqlite python-dotenv
    startCommand: python admin_web/app.py
    healthCheckPath: /
    disk:
      name: funstat-panel-data
      mountPath: /data
      sizeGB: 1
